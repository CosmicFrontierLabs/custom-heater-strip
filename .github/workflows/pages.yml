name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages needs id-token to verify the deployment came from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deploys at once, but do let a newer push supersede a queued
# one -- the site is a build artifact, so only the latest commit matters.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages

      - name: Install trunk
        run: cargo install trunk --locked

      # Project Pages sites are served from /<repo>/, so asset URLs have to be
      # built for that prefix or every one of them 404s.
      - name: Build
        working-directory: frontend
        run: trunk build --release --public-url "/${GITHUB_REPOSITORY#*/}/"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
