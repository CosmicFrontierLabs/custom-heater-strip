[package]
name = "engine"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Path geometry only: usvg's default features pull in fontdb/rustybuzz
# for text shaping, which this project never uses (39% of the wasm bundle).
usvg = { version = "0.45", default-features = false }

shared = { path = "../shared" }
cavalier_contours = "0.7.0"
dxf = "0.6"
zip = { version = "2", default-features = false, features = ["deflate"] }
base64 = "0.22"

# `dxf` depends on `uuid`, which refuses to build for wasm without being told
# where randomness comes from. We never generate a UUID; this just satisfies
# the compile-time check.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1", features = ["js"] }
