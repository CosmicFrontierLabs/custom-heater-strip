<text x="150" y="602" font-size="9" fill="#565f89" text-anchor="start" font-weight="400">terminals, one pitch apart</text>
<text x="84" y="776" font-size="9.5" fill="#565f89" text-anchor="start" font-weight="400">• hops staggered a pitch • outer lane takes the enclosing span • every leg stays on reserved ground</text>
