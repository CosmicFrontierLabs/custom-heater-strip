<text x="50" y="74" font-size="13" font-weight="700" fill="#c0caf5">Merge the selection</text>
<text x="50" y="88" font-size="10.5" fill="#565f89">abutting polygons share an edge, so the union is one region</text>
<rect x="42" y="110" width="110" height="66" fill="#7aa2f7" fill-opacity="0.1" stroke="#7aa2f7" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="97" y="148" font-size="10" fill="#7aa2f7" text-anchor="middle" font-weight="400">poly 1</text>
