<text x="83.0" y="507" font-size="8.5" fill="#f7768e" text-anchor="middle" font-weight="400">3·pitch wide</text>
<rect x="66" y="402" width="150" height="52" fill="#f7768e" fill-opacity="0.13" stroke="#f7768e" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="224" y="418" font-size="9" fill="#f7768e" text-anchor="start" font-weight="400">pocket: tabs + clearance,</text>
<text x="224" y="430" font-size="9" fill="#f7768e" text-anchor="start" font-weight="400">reaching to the lane</text>
