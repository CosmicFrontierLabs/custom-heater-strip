<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000" width="900" height="1000" font-family="DejaVu Sans, system-ui, sans-serif">
<text x="14" y="24" font-size="16" font-weight="700" fill="#c0caf5">How a heater gets routed over a DXF selection</text>
<text x="14" y="42" font-size="11" fill="#565f89">selection → one region → sweep axis → reserved corridor → fill → stitched to the tabs</text>
<rect x="14" y="56" width="430" height="236" rx="7" fill="#16213e" fill-opacity="0.55" stroke="#565f89" stroke-opacity="0.5"/>
