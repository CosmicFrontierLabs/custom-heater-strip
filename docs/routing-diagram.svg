<text x="50" y="322" font-size="13" font-weight="700" fill="#c0caf5">Reserve the terminal zone</text>
<text x="50" y="336" font-size="10.5" fill="#565f89">the fill is handed what is left; nothing is carved away</text>
<rect x="66" y="362" width="340" height="130" fill="#bb9af7" fill-opacity="0.1" stroke="#bb9af7" stroke-width="1.6"/>
<rect x="66" y="362" width="34" height="130" fill="#f7768e" fill-opacity="0.13" stroke="#f7768e" stroke-width="1.2" stroke-dasharray="4 3"/>
