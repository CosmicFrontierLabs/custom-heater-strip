<text x="207" y="148" font-size="10" fill="#7aa2f7" text-anchor="middle" font-weight="400">poly 2</text>
<rect x="262" y="110" width="110" height="66" fill="#7aa2f7" fill-opacity="0.1" stroke="#7aa2f7" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="317" y="148" font-size="10" fill="#7aa2f7" text-anchor="middle" font-weight="400">poly 3</text>
<line x1="152" y1="110" x2="152" y2="176" stroke="#f7768e" stroke-width="2.4"/>
<line x1="262" y1="110" x2="262" y2="176" stroke="#f7768e" stroke-width="2.4"/>
<text x="207" y="192" font-size="9.5" fill="#f7768e" text-anchor="middle" font-weight="400">shared walls — traced as interior, swallowed</text>
<path d="M207 204 l0 16 m-5 -5 l5 5 l5 -5" stroke="#565f89" stroke-width="1.3" fill="none"/>
<rect x="42" y="228" width="330" height="34" fill="#bb9af7" fill-opacity="0.16" stroke="#bb9af7" stroke-width="1.8"/>
<text x="207" y="249" font-size="10.5" fill="#bb9af7" text-anchor="middle" font-weight="700">one region, filled once</text>
<text x="207" y="282" font-size="9" fill="#f7768e" text-anchor="middle" font-weight="400">a boolean OR fails here: the overlap has zero area, so it reads as disjoint</text>
<rect x="456" y="56" width="430" height="236" rx="7" fill="#16213e" fill-opacity="0.55" stroke="#565f89" stroke-opacity="0.5"/>
<circle cx="474" cy="75" r="10" fill="#7aa2f7" fill-opacity="0.22" stroke="#7aa2f7"/>
<text x="474" y="79" font-size="11" font-weight="700" fill="#7aa2f7" text-anchor="middle">2</text>
<text x="492" y="74" font-size="13" font-weight="700" fill="#c0caf5">Pick the sweep axis</text>
<text x="492" y="88" font-size="10.5" fill="#565f89">one span per row, so the axis decides what is reachable</text>
