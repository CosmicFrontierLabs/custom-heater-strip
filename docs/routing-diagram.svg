<text x="755.0" y="256" font-size="10" fill="#9ece6a" text-anchor="middle" font-weight="700">rows along the arms</text>
<text x="755.0" y="270" font-size="9.5" fill="#9ece6a" text-anchor="middle" font-weight="400">1 span → full coverage</text>
<text x="671" y="242" font-size="9.5" fill="#565f89" text-anchor="middle" font-weight="400">all four rotations scored: coverage, then tab stacking, then reach</text>
<rect x="14" y="304" width="430" height="236" rx="7" fill="#16213e" fill-opacity="0.55" stroke="#565f89" stroke-opacity="0.5"/>
<circle cx="32" cy="323" r="10" fill="#7aa2f7" fill-opacity="0.22" stroke="#7aa2f7"/>
